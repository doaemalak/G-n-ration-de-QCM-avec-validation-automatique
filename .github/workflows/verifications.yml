name: Vérifications

# Le notebook demande les six PDF (non versionnés) et des modèles lourds : il n'est
# pas exécuté ici. En revanche, les artefacts versionnés doivent rester cohérents,
# et les scripts d'après-notebook doivent fonctionner sans GPU ni torch.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances des scripts
        run: pip install -r requirements-dev.txt

      - name: Contrôler la cohérence des sorties
        run: python scripts/verifier_sorties.py

      - name: Tester les scripts
        run: python -m pytest -q

      - name: Vérifier que l'export GIFT/HTML/CSV fonctionne
        run: python scripts/exporter_qcm.py --sortie "$RUNNER_TEMP/export"

      - name: Vérifier que les tableaux de l'article se régénèrent
        run: python scripts/tableaux_resultats.py --sortie "$RUNNER_TEMP/resultats.md"
